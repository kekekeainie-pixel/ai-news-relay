name: AI News Relay

on:
  schedule:
    # 每 6 小时一次（UTC）。云端日报 08:00 / 18:00 CST = 00:00 / 10:00 UTC
    - cron: "30 0,6,12,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet twscrape || true

      - name: Fetch relay data
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
        run: python scripts/fetch_relay.py

      - name: Commit data
        run: |
          git config user.name "relay-bot"
          git config user.email "relay-bot@users.noreply.github.com"
          git add data/latest.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "relay: update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
