name: X Debug

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe X paths (no library)
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
        run: python scripts/probe_x_paths.py
      - name: Diagnose X cookie (twscrape)
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
        run: |
          pip install --quiet twscrape
          python scripts/debug_x.py || true
