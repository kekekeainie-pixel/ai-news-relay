name: X Debug

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Z.ai handle
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
        run: python scripts/verify_zai.py
